name: collect

on:
  schedule:
    - cron: "*/15 * * * *"   # опрос каждые 15 минут (GitHub может задерживать запуск на 5–20 мин)
  workflow_dispatch:
    inputs:
      since:
        description: "Догрузка пропуска: начало (YYYY-MM-DD), пусто — обычный опрос"
        required: false
      until:
        description: "Догрузка пропуска: конец, не включая (YYYY-MM-DD)"
        required: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Сбор
        run: |
          if [ -n "${{ inputs.since }}" ]; then
            python collect.py --since "${{ inputs.since }}" --until "${{ inputs.until }}"
          else
            python collect.py
          fi
      - name: Сохранить результат
        run: |
          git config user.name "buffer-collector[bot]"
          git config user.email "buffer-collector@users.noreply.github.com"
          git add data state.json
          if git diff --cached --quiet; then echo "нет новых сообщений"; exit 0; fi
          git commit -m "Сбор $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
